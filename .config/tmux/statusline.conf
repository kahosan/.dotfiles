# vim: ft=tmux

set -g mode-style "fg=colour15,bg=colour4"
set -g message-style "fg=default,bg=default"
set -g pane-border-style "fg=colour0"
set -g pane-active-border-style "fg=colour1"

set -g status "on"
set -g status-interval 2
set -g status-justify "left"
set -g status-style "fg=colour15,bg=default"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE

set -g @net_info ""
if-shell '[ "$(uname)" = "Linux" ]' {
    set -g @net_info '#(bash ~/.config/tmux/netspeed.sh) [#(hostname -I | cut -d" " -f1)]'
}

set -g status-left " #[fg=colour5]#h "
set -g status-right "#{E:@net_info} #[fg=#f9e2af]%H:%M:%S "

setw -g window-status-separator " "
setw -g window-status-style "fg=colour8,bg=default"
setw -g window-status-format ' #I #{b:pane_current_command} '
setw -g window-status-current-style "fg=colour14,bg=default"
setw -g window-status-current-format '#[fg=colour14][#I #{b:pane_current_command}]'
